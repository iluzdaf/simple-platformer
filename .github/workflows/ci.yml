name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Formatting and static analysis
    # Strict branch protection runs these checks before a pull request can merge.
    # Do not repeat the uncached analysis on the resulting push to main.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    env:
      LLVM: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Select preinstalled LLVM tools
        run: |
          clang-$LLVM --version
          clang-format-$LLVM --version
          clang-tidy-$LLVM --version
          echo "CLANG_FORMAT=$(command -v clang-format-$LLVM)" >> "$GITHUB_ENV"
          echo "CLANG_TIDY=$(command -v clang-tidy-$LLVM)" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S . -B build/quality
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-$LLVM
          -DCMAKE_CXX_COMPILER=clang++-$LLVM
          -DCLANG_FORMAT_EXECUTABLE=$CLANG_FORMAT
          -DCLANG_TIDY_EXECUTABLE=$CLANG_TIDY
          -DGLFW_BUILD_X11=OFF
          -DGLFW_BUILD_WAYLAND=OFF
      - name: Check formatting
        run: cmake --build build/quality --target format-check
      - name: Check headers stand alone
        run: cmake --build build/quality --target header_self_containment
      - name: Run static analysis
        shell: bash
        run: |
          {
            find app src tests -type f -name '*.cpp' -print0
            find app include -type f -name '*.hpp' -print0
          } | xargs -0 -P"$(nproc)" -n1 \
            "$CLANG_TIDY" \
            -p build/quality \
            --warnings-as-errors='*' \
            --quiet

  macos:
    name: macOS / Apple Clang
    runs-on: macos-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Configure
        run: >
          cmake --preset mac-debug
          -DCMAKE_C_COMPILER_LAUNCHER="$SCCACHE_PATH"
          -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_PATH"
      - name: Build
        run: cmake --build --preset mac-debug
      - name: Show compiler cache statistics
        run: '"$SCCACHE_PATH" --show-stats'
      - name: Test
        run: ctest --preset mac-debug

  windows:
    name: Windows / Visual Studio 2022
    runs-on: windows-2022
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Prepare compiler cache for MSBuild
        run: |
          $compilerCache = Join-Path $env:RUNNER_TEMP "sccache-msbuild"
          New-Item -ItemType Directory -Force -Path $compilerCache | Out-Null
          Copy-Item "$env:SCCACHE_PATH.exe" (Join-Path $compilerCache "cl.exe")
          "SCCACHE_MSBUILD_PATH=$compilerCache" >> $env:GITHUB_ENV
      - name: Generate Visual Studio solution
        run: >
          cmake --preset windows-vs
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      - name: Build Visual Studio solution
        run: >
          msbuild build\windows-vs\SimplePlatformer.sln
          /m
          /p:Configuration=Debug
          /p:Platform=x64
          /p:CLToolExe=cl.exe
          "/p:CLToolPath=$env:SCCACHE_MSBUILD_PATH"
          /p:TrackFileAccess=false
          /p:UseMultiToolTask=true
      - name: Run tests through Visual Studio project
        run: >
          msbuild build\windows-vs\run_tests.vcxproj
          /m
          /p:Configuration=Debug
          /p:Platform=x64
          /p:CLToolExe=cl.exe
          "/p:CLToolPath=$env:SCCACHE_MSBUILD_PATH"
          /p:TrackFileAccess=false
          /p:UseMultiToolTask=true
      - name: Show compiler cache statistics
        run: '& $env:SCCACHE_PATH --show-stats'
