name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  formatting:
    name: Formatting
    # Strict branch protection runs this job, the header check, and static analysis before
    # a pull request can merge. Do not repeat them on the resulting push to main.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    env:
      LLVM: 18
      PRETTIER: 3.9.8
      RUFF: 0.16.8
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Select preinstalled LLVM tools
        run: |
          clang-$LLVM --version
          clang-format-$LLVM --version
          echo "CLANG_FORMAT=$(command -v clang-format-$LLVM)" >> "$GITHUB_ENV"
      - name: Install the pinned Prettier
        run: |
          npm install --global --no-fund --no-audit prettier@$PRETTIER
          prettier --version
          echo "PRETTIER_BIN=$(command -v prettier)" >> "$GITHUB_ENV"
      - name: Install the pinned Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: ${{ env.RUFF }}
          args: --version
      - name: Configure
        run: >
          cmake -S . -B build/quality
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-$LLVM
          -DCMAKE_CXX_COMPILER=clang++-$LLVM
          -DCLANG_FORMAT_EXECUTABLE=$CLANG_FORMAT
          -DPRETTIER_EXECUTABLE=$PRETTIER_BIN
          -DGLFW_BUILD_X11=OFF
          -DGLFW_BUILD_WAYLAND=OFF
      - name: Check formatting
        run: cmake --build build/quality --target format-check
      - name: Check JSON formatting
        run: cmake --build build/quality --target format-json-check
      - name: Check YAML formatting
        run: cmake --build build/quality --target format-yaml-check
      - name: Check Python formatting and lint
        run: cmake --build build/quality --target format-python-check lint-python

  headers:
    name: Headers stand alone
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    env:
      LLVM: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Select preinstalled LLVM tools
        run: clang-$LLVM --version
      - name: Configure
        run: >
          cmake -S . -B build/quality
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-$LLVM
          -DCMAKE_CXX_COMPILER=clang++-$LLVM
          -DGLFW_BUILD_X11=OFF
          -DGLFW_BUILD_WAYLAND=OFF
      - name: Check headers stand alone
        run: cmake --build build/quality --target header_self_containment --parallel "$(nproc)"

  static-analysis:
    name: Static analysis (${{ matrix.shard }}/3)
    # Header changes bring their transitive includers with them. Three shards keep
    # broad changes and full-tree fallbacks from returning to one long-running job.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      LLVM: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select affected files
        id: targets
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          targets="$RUNNER_TEMP/tidy-targets.txt"
          python3 tools/tidy_targets.py --since "$BASE_REF" \
            | split -n r/${{ matrix.shard }}/3 > "$targets"

          count=$(wc -l < "$targets" | tr -d ' ')
          echo "$count files in this shard"
          if [ "$count" -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Select preinstalled LLVM tools
        if: steps.targets.outputs.has_files == 'true'
        run: |
          clang-$LLVM --version
          clang-tidy-$LLVM --version
          echo "CLANG_TIDY=$(command -v clang-tidy-$LLVM)" >> "$GITHUB_ENV"
      - name: Configure
        if: steps.targets.outputs.has_files == 'true'
        run: >
          cmake -S . -B build/quality
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-$LLVM
          -DCMAKE_CXX_COMPILER=clang++-$LLVM
          -DCLANG_TIDY_EXECUTABLE=$CLANG_TIDY
          -DGLFW_BUILD_X11=OFF
          -DGLFW_BUILD_WAYLAND=OFF
      - name: Run static analysis
        if: steps.targets.outputs.has_files == 'true'
        shell: bash
        run: |
          xargs -P"$(nproc)" -n1 \
            "$CLANG_TIDY" \
            -p build/quality \
            --warnings-as-errors='*' \
            --quiet \
            < "$RUNNER_TEMP/tidy-targets.txt"

  static-analysis-result:
    name: Static analysis
    # The check branch protection requires, so it doesn't name each shard. A skipped job
    # would count as passing, so this one always runs and fails unless every shard succeeded.
    if: always() && github.event_name != 'push'
    needs: static-analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Require every static analysis shard
        run: test "${{ needs.static-analysis.result }}" = success

  macos:
    name: macOS / Apple Clang
    runs-on: macos-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Configure
        run: >
          cmake --preset mac-debug
          -DCMAKE_C_COMPILER_LAUNCHER="$SCCACHE_PATH"
          -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_PATH"
      - name: Build
        run: cmake --build --preset mac-debug --parallel 3
      - name: Show compiler cache statistics
        run: '"$SCCACHE_PATH" --show-stats'
      - name: Test
        run: ctest --preset mac-debug

  windows:
    name: Windows / Visual Studio 2022
    runs-on: windows-2022
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Prepare compiler cache for MSBuild
        run: |
          $compilerCache = Join-Path $env:RUNNER_TEMP "sccache-msbuild"
          New-Item -ItemType Directory -Force -Path $compilerCache | Out-Null
          Copy-Item "$env:SCCACHE_PATH.exe" (Join-Path $compilerCache "cl.exe")
          "SCCACHE_MSBUILD_PATH=$compilerCache" >> $env:GITHUB_ENV
      - name: Generate Visual Studio solution
        run: >
          cmake --preset windows-vs
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      - name: Build Visual Studio solution
        run: >
          msbuild build\windows-vs\SimplePlatformer.sln
          /m
          /p:Configuration=Debug
          /p:Platform=x64
          /p:CLToolExe=cl.exe
          "/p:CLToolPath=$env:SCCACHE_MSBUILD_PATH"
          /p:TrackFileAccess=false
          /p:UseMultiToolTask=true
      - name: Run tests through Visual Studio project
        run: >
          msbuild build\windows-vs\run_tests.vcxproj
          /m
          /p:Configuration=Debug
          /p:Platform=x64
          /p:CLToolExe=cl.exe
          "/p:CLToolPath=$env:SCCACHE_MSBUILD_PATH"
          /p:TrackFileAccess=false
          /p:UseMultiToolTask=true
      - name: Show compiler cache statistics
        run: "& $env:SCCACHE_PATH --show-stats"
